name: Publish event page
# optional github pages deployment; vercel is the primary host.
on:
  workflow_dispatch:

permissions:
  # request only the permissions required to upload and publish a pages artifact.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package only the public frontend
        # copy a fixed list of public files, never backend settings or attendee data.
        run: |
          mkdir -p public-site/assets
          cp index.html public-site/index.html
          cp assets/computing-club-logo.png public-site/assets/computing-club-logo.png
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
