name: Publish event page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package only the public frontend
        run: |
          mkdir public-site
          cp index.html public-site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
